name: Build macOS binary bundle

on:
  push:
    branches: [lan-proxy-support]
    tags: ["binary-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Honour the repo's pin (upstream #133). Without this the action
          # installs whatever bun is newest, so the job silently drifts version
          # to version and a failure can never be reproduced against a known
          # toolchain. Every upstream workflow passes this; this one is ours and
          # was missed when it was ported over from Forgejo Actions.
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build binary bundle
        run: bun run packages/serve-sim/build.ts

      - name: Test
        run: |
          # The sim-backed e2e tests skip without a booted simulator, but a few
          # integration tests race native cleanup on a loaded runner.
          #
          # ⚠ There is a KNOWN upstream flake in here:
          #   SimCameraHelper shm probe > shutdown unmaps shm so a fresh
          #   shm_open returns -1 (ENOENT)
          # It fails as `helper exited with null (expected 0)` — the helper is
          # killed by a signal instead of exiting 0 during shutdown. Bisected to
          # upstream `14ad57f` ("Harden helper shutdown and HID log timing"):
          # its parent `7f109fb` passes 8/8, `14ad57f` fails 2/10 and the tip
          # 2/8, on pristine checkouts with none of this fork's code. Measured
          # locally 2026-08-22; the rate is higher on a loaded CI runner.
          #
          # THREE attempts, not two. At a ~25% per-run failure rate two attempts
          # still lose ~6% of the time, which is frequent enough to block a
          # release for a fault that is not ours. Three puts it near ~1.5%.
          # A real regression still reproduces on all three.
          #
          # Not a simulator reboot between attempts (what upstream's
          # sim-test.yml does): this flake is in the camera helper's own
          # shutdown path, not in a wedged simulator, so a reboot would cost
          # minutes and fix nothing.
          run_tests() { bun test --max-concurrency=1 packages/serve-sim/src/__tests__/; }
          for attempt in 1 2 3; do
            if run_tests; then
              [ "$attempt" -gt 1 ] && echo "::warning title=test retry::passed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning title=test retry::attempt $attempt failed; retrying"
              sleep 5
            fi
          done
          echo "::error title=tests failed::all 3 attempts failed — treat as a real regression"
          exit 1

      - name: Create checksum
        run: |
          archives=(packages/serve-sim/dist/serve-sim-*-macos-*.zip)
          if [ ! -f "${archives[0]}" ]; then
            echo "No binary archive was produced."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            archive_dir=$(dirname "$archive")
            archive_name=$(basename "$archive")
            (cd "$archive_dir" && shasum -a 256 "$archive_name" > "$archive_name.sha256")
          done

      - name: Publish build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/binary-v') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(packages/serve-sim/dist/serve-sim-*-macos-*.zip \
                    packages/serve-sim/dist/serve-sim-*-macos-*.zip.sha256)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No archives to upload."
            exit 1
          fi

          if [ "$IS_TAG" = "true" ]; then
            # Permanent release for the binary-v* tag.
            gh release create "$REF_NAME" "${archives[@]}" \
              --title "serve-sim $REF_NAME" \
              --notes "Compiled macOS binary bundle for $REF_NAME." \
              --target "$SHA"
            echo "Published permanent release $REF_NAME"
          else
            # Rolling prerelease tracking the tip of lan-proxy-support, so every
            # branch push replaces the download at a stable URL. Deleting the
            # old release (and its tag) keeps assets from accumulating; it is a
            # no-op on the first run, hence the `|| true`.
            TAG="binary-lan-proxy"
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" "${archives[@]}" \
              --title "serve-sim (lan-proxy-support latest build)" \
              --notes "Rolling build from lan-proxy-support @ ${SHA:0:12}. Not a stable release — use a binary-v* tag for that." \
              --prerelease \
              --target "$SHA"
            echo "Published rolling prerelease $TAG"
          fi
